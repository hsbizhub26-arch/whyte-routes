<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WHYTE ROUTES — Upgrade</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
  body {
    background: black;
    color: white;
    font-family: Inter, sans-serif;
    padding: 40px;
  }
  .price-card {
    background: #0f0f0f;
    border: 1px solid #d9a63a;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<h1>Upgrade to WHYTE ROUTES</h1>
<p>Dispatch tools · Driver GPS · Multi-driver mode · Priority routing</p>

<div id="priceContainer"></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
const stripe = Stripe("YOUR_PUBLISHABLE_KEY");

const prices = [
  { name: "Premium Monthly", id: "price_XXXX", amount: "149 CAD" },
  { name: "Premium Plus Monthly", id: "price_1SXoWQHmaeSaRKINF2Eps9i0", amount: "229.99 CAD" },
  { name: "Premium Yearly", id: "price_1SXoX1HmaeSaRKINyKEtkUSs", amount: "1499.99 CAD" },
  { name: "Premium Plus Yearly", id: "price_1SXoZoHmaeSaRKINM6SlB9yr", amount: "1999.99 CAD" }
];

const container = document.getElementById("priceContainer");

prices.forEach(p => {
  container.innerHTML += `
    <div class="price-card">
      <h3>${p.name}</h3>
      <p style="color:#d9a63a;font-size:20px;"><strong>${p.amount}</strong></p>
      <button class="btn btn-warning" onclick="buy('${p.id}')">Subscribe</button>
    </div>
  `;
});

function buy(priceId) {
  fetch("/create-checkout-session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ priceId })
  })
  .then(res => res.json())
  .then(data => stripe.redirectToCheckout({ sessionId: data.sessionId }));
}
</script>
</body>
</html>
